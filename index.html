<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="A little perspective on a very big universe. Explore confirmed exoplanets, discover how we find them, and follow the science with NASA." />
    <title>Exoplanet Explorer | Worlds beyond our own</title>
    <link rel="icon" type="image/svg+xml" href="/planet.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Exoplanet Explorer needs JavaScript to display its NASA data snapshot. Visit https://science.nasa.gov/exoplanets/ for NASA's exoplanet resources.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
